server {
    listen 80;
    server_name pretenzii.mebel-arigato.ru;
    client_max_body_size 200m;          # фото и видео дефектов

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# HTTPS: sudo certbot --nginx -d pretenzii.mebel-arigato.ru  (добавит блок 443 и редирект)
